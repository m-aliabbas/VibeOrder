<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeOrder Kitchen</title>
<style>
  :root { --bg:#14110f; --panel:#1f1a17; --line:#3a312b; --ink:#f5efe8; --muted:#b3a597; --accent:#ff7a1a;
          --ok:#3fbf6f; --warn:#ffb020; --late:#ff4d4d; --info:#5aa9ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.35 system-ui, -apple-system, "Segoe UI", "Noto Nastaliq Urdu", sans-serif; }
  header { display:flex; gap:16px; align-items:center; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2; }
  header h1 { font-size:22px; margin:0; letter-spacing:.02em; }
  header .grow { flex:1; }
  .pill { padding:6px 12px; border-radius:999px; font-weight:600; font-size:15px; border:1px solid var(--line); }
  .pill.ok { color:var(--ok); border-color:var(--ok); }
  .pill.bad { color:var(--late); border-color:var(--late); }
  button { font:inherit; min-height:56px; min-width:56px; padding:10px 18px; border-radius:12px; border:1px solid var(--line); background:#2b2420; color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#1b0f05; font-weight:700; }
  button.ready { background:var(--ok); border-color:var(--ok); color:#06210f; font-weight:700; }
  button:disabled { opacity:.5; }
  main { padding:16px 20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:16px; }
  .card { background:var(--panel); border:2px solid var(--line); border-radius:16px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
  .card.preparing { border-color:var(--info); }
  .changes { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:16px; margin-bottom:18px; }
  .change { background:#3a2410; border:3px solid var(--warn); border-radius:16px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
  .change .top { flex-wrap:wrap; row-gap:4px; }
  .change .what { font-size:20px; font-weight:700; color:var(--warn); }
  .change li.cancelled { text-decoration:line-through; color:var(--late); }
  .chg { color:var(--warn); font-weight:600; }
  .card.late { border-color:var(--late); }
  .card .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .token { font-size:30px; font-weight:800; }
  .where { font-size:20px; font-weight:700; color:var(--accent); }
  .times { display:flex; gap:14px; font-size:16px; color:var(--muted); }
  .times b { color:var(--ink); }
  .times .late b { color:var(--late); }
  .label { font-size:24px; font-weight:800; }
  .detail { margin:0; padding-left:18px; font-size:20px; }
  .detail li.side { font-weight:700; }
  .note { background:#3b2a12; color:#ffd59a; padding:6px 10px; border-radius:8px; font-weight:700; }
  .kind { font-size:14px; font-weight:800; padding:2px 8px; border-radius:6px; background:var(--warn); color:#2a1a00; }
  .status { font-weight:700; font-size:15px; text-transform:uppercase; letter-spacing:.06em; }
  .actions { display:flex; gap:10px; margin-top:auto; }
  .actions button { flex:1; }
  .center { max-width:460px; margin:60px auto; background:var(--panel); padding:28px; border-radius:16px; border:1px solid var(--line); display:flex; flex-direction:column; gap:14px; }
  input, select { font:inherit; font-size:24px; padding:12px; border-radius:10px; border:1px solid var(--line); background:#0f0d0c; color:var(--ink); }
  .error { color:var(--late); font-weight:600; min-height:1.3em; }
  .empty { color:var(--muted); font-size:24px; text-align:center; padding:80px 0; }
  .ready-strip { margin-top:24px; color:var(--muted); font-size:16px; }
  .ready-strip span { display:inline-block; margin:4px 8px 0 0; padding:4px 10px; border:1px solid var(--ok); color:var(--ok); border-radius:8px; }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>VibeOrder Kitchen</h1>
  <span id="station" class="muted"></span>
  <span class="grow"></span>
  <span id="clock" class="muted"></span>
  <span id="conn" class="pill">…</span>
  <button id="switch" hidden>Switch</button>
</header>
<main id="app"></main>
<script>
(() => {
  const S = {
    get(k) { try { return localStorage.getItem('vo.kds.' + k); } catch { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem('vo.kds.' + k) : localStorage.setItem('vo.kds.' + k, v); } catch {} },
  };
  const app = document.getElementById('app');
  const conn = document.getElementById('conn');
  let state = { branch: S.get('branch'), device: S.get('device'), session: S.get('session'), station: S.get('station'),
                stations: [], busy: new Set(), lastOk: 0, timer: null };

  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function uuid() { return crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c=='x'?r:(r&3|8)).toString(16); }); }
  async function api(path, opts = {}) {
    const headers = { 'Content-Type': 'application/json', 'X-Device-Token': state.device || '' };
    if (state.session) headers.Authorization = 'Bearer ' + state.session;
    if (opts.key) headers['Idempotency-Key'] = opts.key;
    const url = path.startsWith('/') ? path : `/api/v1/branches/${state.branch}/${path}`;
    const res = await fetch(url, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) { state.session = null; S.set('session', null); render(); }
    return { ok: res.ok, status: res.status, data };
  }
  function setConn(ok) {
    conn.textContent = ok ? 'Branch connected' : 'CONNECTION LOST – showing last data';
    conn.className = 'pill ' + (ok ? 'ok' : 'bad');
  }
  function mins(ms) { const m = Math.round(ms / 60000); return m <= 0 ? 'now' : m + ' min'; }
  function hhmm(iso) { return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

  function render() {
    clearInterval(state.timer);
    document.getElementById('switch').hidden = !state.session;
    if (!state.device) return renderPair();
    if (!state.session) return renderLogin();
    return renderQueue();
  }

  function renderPair() {
    app.innerHTML = `<form class="center" id="f"><h2>Pair this kitchen screen</h2>
      <p class="muted">Ask a manager for a pairing code.</p>
      <input name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" required>
      <div class="error" id="err"></div><button class="primary">Pair screen</button></form>`;
    document.getElementById('f').onsubmit = async e => {
      e.preventDefault();
      const r = await api('/api/v1/pair', { method: 'POST', body: { code: e.target.code.value.trim(), name: 'Kitchen display' } });
      if (!r.ok) return document.getElementById('err').textContent = r.data.message || 'Pairing failed';
      state.device = r.data.device_token; state.branch = r.data.branch_id;
      S.set('device', state.device); S.set('branch', state.branch); render();
    };
  }

  async function renderLogin() {
    app.innerHTML = `<div class="center"><p class="muted">Loading staff…</p></div>`;
    const r = await api('staff-directory');
    if (!r.ok) { app.innerHTML = `<div class="center"><div class="error">${esc(r.data.message || 'Cannot reach branch server')}</div><button id="re">Pair again</button></div>`;
      document.getElementById('re').onclick = () => { S.set('device', null); state.device = null; render(); }; return; }
    const cooks = r.data.staff.filter(s => s.roles.some(x => ['cook', 'packer', 'manager'].includes(x)));
    app.innerHTML = `<form class="center" id="f"><h2>Kitchen sign in</h2>
      <select name="u">${cooks.map(s => `<option value="${esc(s.username)}">${esc(s.display_name)}</option>`).join('')}</select>
      <input name="pin" type="password" inputmode="numeric" placeholder="PIN" required>
      <div class="error" id="err"></div><button class="primary">Sign in</button></form>`;
    document.getElementById('f').onsubmit = async e => {
      e.preventDefault();
      const res = await api('sessions', { method: 'POST', body: { username: e.target.u.value, pin: e.target.pin.value } });
      if (!res.ok) return document.getElementById('err').textContent = res.data.message || 'Sign in failed';
      state.session = res.data.session_token; S.set('session', state.session); render();
    };
  }

  async function renderQueue() {
    if (!state.stations.length) {
      const b = await api('bootstrap');
      if (!b.ok) return;
      state.stations = b.data.stations;
      if (!state.stations.find(s => s.id === state.station)) state.station = null;
    }
    if (!state.station) {
      app.innerHTML = `<div class="center"><h2>Choose station</h2>${state.stations.map(s =>
        `<button data-id="${s.id}">${esc(s.name)}</button>`).join('')}</div>`;
      app.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => { state.station = b.dataset.id; S.set('station', state.station); render(); });
      return;
    }
    const st = state.stations.find(s => s.id === state.station);
    document.getElementById('station').textContent = st ? '· ' + st.name : '';
    await poll();
    state.timer = setInterval(poll, 2000);
  }

  async function poll() {
    try {
      const r = await api(`stations/${state.station}/queue`);
      if (!r.ok) return setConn(false);
      state.lastOk = Date.now(); setConn(true); draw(r.data);
    } catch { setConn(false); }
  }

  function changesStrip(q) {
    if (!q.changes || !q.changes.length) return '';
    return `<section class="changes">${q.changes.map(t => {
      const where = t.check.table ? 'Table ' + esc(t.check.table) : esc(t.check.service_type.replace('_', ' ')).toUpperCase();
      return `<article class="change"><div class="top"><span class="token">#${esc(t.check.token)} · ${where}</span><span class="kind">${esc(t.kind.toUpperCase())} · Tkt ${t.seq}</span></div>
        <div class="what">${esc(t.note)}</div>
        ${t.items.length ? `<ul class="detail">${t.items.map(i => `<li class="${i.status === 'cancelled' ? 'cancelled' : ''}">${i.quantity} × ${esc(i.label)}${i.change_note && i.change_note !== t.note ? ` — ${esc(i.change_note)}` : ''}</li>`).join('')}</ul>` : ''}
        <div class="actions"><button class="primary" data-ack="${t.id}">✓ Acknowledge</button></div></article>`; }).join('')}</section>`;
  }

  function draw(q) {
    const now = new Date(q.server_time).getTime();
    if (!q.items.length) {
      app.innerHTML = changesStrip(q) + `<div class="empty">No tickets waiting</div>` + readyStrip(q);
      bindAck();
      return;
    }
    app.innerHTML = changesStrip(q) + `<div class="grid">${q.items.map(it => {
      const due = new Date(it.ticket.due_at).getTime(), sent = new Date(it.ticket.created_at).getTime();
      const late = now > due;
      const where = it.check.table ? 'Table ' + esc(it.check.table) : esc(it.check.service_type.replace('_', ' ')).toUpperCase();
      const kind = it.ticket.kind !== 'original' ? `<span class="kind">${esc(it.ticket.kind.toUpperCase())}</span>` : '';
      return `<article class="card ${it.status} ${late ? 'late' : ''}">
        <div class="top"><span class="token">#${esc(it.check.token)}</span><span class="where">${where}</span></div>
        <div class="times"><span>Age <b>${mins(now - sent)}</b></span><span class="${late ? 'late' : ''}">Due <b>${hhmm(it.ticket.due_at)}</b>${late ? ' ⚠ LATE' : ''}</span><span>Tkt ${it.ticket.seq} · R${it.ticket.round}</span></div>
        <div>${kind} <span class="status">${it.status === 'preparing' ? '▶ Preparing' : '● Queued'}</span></div>
        <div class="label">${it.quantity} × ${esc(it.label)}</div>
        ${it.slot_name ? `<div class="muted">Deal: ${esc(it.slot_name)}</div>` : ''}
        <ul class="detail">${it.detail.map(d => `<li class="${/half/i.test(d) ? 'side' : ''}">${esc(d)}</li>`).join('')}</ul>
        ${it.notes ? `<div class="note">⚠ ${esc(it.notes)}</div>` : ''}
        ${it.change_note ? `<div class="chg">${it.is_remake ? '↻' : '✎'} ${esc(it.change_note)}</div>` : ''}
        <div class="actions">
          ${it.status === 'queued' ? `<button data-act="preparing" data-id="${it.id}" data-rev="${it.revision}">Start</button>` : ''}
          <button class="ready" data-act="ready" data-id="${it.id}" data-rev="${it.revision}">✓ Ready</button>
        </div></article>`; }).join('')}</div>` + readyStrip(q);
    app.querySelectorAll('button[data-act]').forEach(b => {
      if (state.busy.has(b.dataset.id)) b.disabled = true;
      b.onclick = () => transition(b.dataset.id, b.dataset.act, +b.dataset.rev);
    });
    bindAck();
  }
  function bindAck() {
    app.querySelectorAll('button[data-ack]').forEach(b => {
      b.onclick = async () => {
        b.disabled = true;
        const key = uuid();
        for (let attempt = 0; attempt < 3; attempt++) {
          try { await api(`tickets/${b.dataset.ack}/acknowledge`, { method: 'POST', key, body: {} }); break; }
          catch { await new Promise(res => setTimeout(res, 800)); }
        }
        poll();
      };
    });
  }
  function readyStrip(q) {
    if (!q.recently_ready.length) return '';
    return `<div class="ready-strip">Recently ready: ${q.recently_ready.map(i => `<span>#${esc(i.check.token)} ${esc(i.label)}</span>`).join('')}</div>`;
  }
  async function transition(id, to, rev) {
    if (state.busy.has(id)) return;
    state.busy.add(id);
    const key = uuid();
    try {
      let r;
      for (let attempt = 0; attempt < 3; attempt++) {  // same key on retry: never doubles a transition
        try { r = await api(`ticket-items/${id}/transitions`, { method: 'POST', key, body: { to, expected_revision: rev } }); break; }
        catch { await new Promise(res => setTimeout(res, 800)); }
      }
    } finally { state.busy.delete(id); poll(); }
  }

  document.getElementById('switch').onclick = async () => {
    await api('sessions/logout', { method: 'POST' }).catch(() => {});
    state.session = null; S.set('session', null); state.station = null; S.set('station', null); state.stations = []; render();
  };
  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }, 1000);
  render();
})();
</script>
</body>
</html>
