<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Your order</title>
<style>
  :root { --bg:#fbf7f2; --panel:#fff; --ink:#221a14; --muted:#7a6a5c; --line:#eadfd3; --accent:#d9480f; --ok:#2b8a3e; --bad:#c92a2a; --warn:#e67700; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14110f; --panel:#1f1a17; --ink:#f5efe8; --muted:#b3a597; --line:#3a312b; --accent:#ff7a1a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px; display:flex; flex-direction:column; gap:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; }
  h1 { margin:0; font-size:24px; }
  .status { font-size:22px; font-weight:800; }
  .status.pending, .status.checking, .status.awaiting_payment { color:var(--warn); }
  .status.accepted { color:var(--ok); } .status.rejected, .status.expired { color:var(--bad); }
  .muted { color:var(--muted); }
  .steps { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .step { padding:6px 10px; border-radius:999px; border:1px solid var(--line); font-size:14px; }
  .step.done { border-color:var(--ok); color:var(--ok); font-weight:700; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:4px 0; }
  .num { font-size:40px; font-weight:900; letter-spacing:.04em; }
</style>
</head>
<body>
<main id="m"><p class="muted">Loading your order…</p></main>
<script>
const TOKEN = "{{ token|escapejs }}";
const money = m => "Rs " + (m / 100).toLocaleString("en-PK");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load() {
  try {
    const r = await fetch(`/api/v1/track/${encodeURIComponent(TOKEN)}`);
    const o = await r.json();
    if (!r.ok) throw new Error(o.message || "Order not found");
    const steps = o.service_type === "delivery" ? [["accepted", "Confirmed"], ["preparing", "Preparing"], ["ready", "Packed"], ["out_for_delivery", "On the way"], ["delivered", "Delivered"]]
                                               : [["accepted", "Confirmed"], ["preparing", "Preparing"], ["ready", "Ready for pickup"], ["collected", "Collected"]];
    const order = steps.map(s => s[0]);
    const at = o.status !== "accepted" ? -1 : Math.max(0, order.indexOf(o.progress || "preparing"));
    document.getElementById("m").innerHTML = `
      <div class="card"><div class="muted">${esc(o.branch)} · reference ${esc(o.reference)}</div>
        ${o.order_number ? `<div class="muted" style="margin-top:8px">Order number</div><div class="num">${esc(o.order_number)}</div>` : ""}
        <div class="status ${esc(o.status)}" style="margin-top:8px">${esc({pending: "Waiting for the branch", checking: "Checking with the branch", accepted: "Confirmed", rejected: "Not accepted", expired: "Not confirmed", awaiting_payment: "Waiting for payment"}[o.status] || o.status)}</div>
        <div>${esc(o.message)}</div>
        ${o.promised_at ? `<div class="muted" style="margin-top:6px">Expected around ${new Date(o.promised_at).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})}</div>` : ""}
        ${at >= 0 ? `<div class="steps">${steps.map((s, i) => `<span class="step ${i <= at ? "done" : ""}">${s[1]}</span>`).join("")}</div>` : ""}
        ${o.progress === "delivery_failed" ? `<p class="status rejected">Delivery attempt failed. The branch will contact you.</p>` : ""}
      </div>
      <div class="card">${o.items.map(i => `<div class="row"><span>${i.quantity} × ${esc(i.name)}</span><span>${money(i.total_minor)}</span></div>`).join("")}
        <div class="row" style="font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:8px"><span>Total (${o.payment === "cod" ? "pay on " + (o.service_type === "delivery" ? "delivery" : "pickup") : "paid online"})</span><span>${money(o.total_minor)}</span></div></div>
      <p class="muted">Keep this page open; it updates by itself. Anyone with this link can see this order.</p>`;
  } catch (e) { document.getElementById("m").innerHTML = `<div class="card"><b>${esc(e.message)}</b><p class="muted">We'll retry in a moment.</p></div>`; }
}
load(); setInterval(load, 4000);
</script>
</body>
</html>
